[project]
name = "digikabu-hacs"
version = "0.9.1"
description = "Student-only DigiKabu integration for Home Assistant"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.10.1",
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "aioresponses>=0.7.8",
  "ruff>=0.12",
  "infrared-protocols==10.1.0",
  "tqdm>=4.70.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
